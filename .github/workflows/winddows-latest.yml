name: C/C++ CI (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Add GCC and mingw32-make (pre-installed on windows-latest) to PATH
    - name: Add MinGW to PATH
      shell: bash
      run: echo "C:\ProgramData\chocolatey\bin" >> $GITHUB_PATH

    # 2. Run premake5.exe directly from your repository's ./build directory
    - name: Configure Project (Premake)
      shell: cmd
      run: |
        cd build
        premake5.exe --file=premake5.lua gmake

    # 3. Clean and build using MinGW Make
    - name: Build Project
      shell: cmd
      run: |
        mingw32-make clean
        mingw32-make
